name: Deploy to aiserver1

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-aiserver1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AISERVER1_HOST }}
          port: ${{ secrets.AISERVER1_PORT }}
          username: ${{ secrets.AISERVER1_USER }}
          key: ${{ secrets.AISERVER1_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="$HOME/cont_damage_detect"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch main https://github.com/chuson24/cont_damage_detect.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d
            docker image prune -f
